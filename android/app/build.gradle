plugins { id 'com.android.application' }
android {
    namespace 'io.github.danfulton72.easyplex'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.danfulton72.easyplex'
        minSdk 28
        targetSdk 28
        // GITHUB_RUN_NUMBER can exceed Integer.MAX_VALUE on high-volume repos, so
        // guard against overflow. versionCode must be a positive int <= 2^31-1.
        def runNumStr = System.getenv('GITHUB_RUN_NUMBER')
        def runNum = (runNumStr != null && runNumStr.isInteger()) ? (runNumStr.toLong() % 100000L) as int : 5
        versionCode runNum + 1000
        versionName "0.2.${runNum}"
    }
    signingConfigs {
        persistent {
            storeFile file(System.getenv('EASYPLEX_KEYSTORE_PATH') ?: 'easyplex-release.jks')
            storePassword System.getenv('EASYPLEX_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('EASYPLEX_KEY_ALIAS') ?: 'easyplex'
            keyPassword System.getenv('EASYPLEX_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.persistent
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.persistent
        }
    }
    // The web UI lives in /web at the repository root and is packaged as-is.
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "EasyPlex-${variant.buildType.name}.apk" }
}
