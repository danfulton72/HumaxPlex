plugins { id 'com.android.application' }
android {
    namespace 'org.samsucks.humax'
    compileSdk 35
    defaultConfig {
        applicationId 'org.samsucks.humax'
        minSdk 28
        targetSdk 28
        def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '5').toString()
        versionCode (runNumber.isInteger() ? runNumber.toInteger() : 5) + 1000
        versionName "0.2.${runNumber}"
    }
    signingConfigs {
        persistent {
            storeFile file(System.getenv('HUMAX_KEYSTORE_PATH') ?: 'humax-release.jks')
            storePassword System.getenv('HUMAX_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('HUMAX_KEY_ALIAS') ?: 'humaxplex'
            keyPassword System.getenv('HUMAX_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.persistent
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.persistent
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "HumaxPlex-${variant.buildType.name}.apk" }
}
