name: Build EasyPlex debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Android TV launcher banner
        run: |
          python -m pip install Pillow
          python scripts/make_tv_banner.py
      - name: Install persistent signing certificate
        env:
          EASYPLEX_KEYSTORE_BASE64: ${{ secrets.EASYPLEX_KEYSTORE_BASE64 || secrets.HUMAX_KEYSTORE_BASE64 }}
          EASYPLEX_KEYSTORE_PASSWORD: ${{ secrets.EASYPLEX_KEYSTORE_PASSWORD || secrets.HUMAX_KEYSTORE_PASSWORD }}
          EASYPLEX_KEY_ALIAS: ${{ secrets.EASYPLEX_KEY_ALIAS || secrets.HUMAX_KEY_ALIAS }}
          EASYPLEX_KEY_PASSWORD: ${{ secrets.EASYPLEX_KEY_PASSWORD || secrets.HUMAX_KEY_PASSWORD }}
        run: |
          if [ -z "$EASYPLEX_KEYSTORE_BASE64" ] || [ -z "$EASYPLEX_KEYSTORE_PASSWORD" ] || [ -z "$EASYPLEX_KEY_ALIAS" ] || [ -z "$EASYPLEX_KEY_PASSWORD" ]; then
            echo "::error::Persistent signing is not configured. Set the four EASYPLEX_* repository Actions secrets (see README); the older HUMAX_* names are also accepted."
            exit 1
          fi
          printf '%s' "$EASYPLEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easyplex-release.jks"
          chmod 600 "$RUNNER_TEMP/easyplex-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/easyplex-release.jks" -storepass "$EASYPLEX_KEYSTORE_PASSWORD" >/dev/null
          echo "EASYPLEX_KEYSTORE_PATH=$RUNNER_TEMP/easyplex-release.jks" >> "$GITHUB_ENV"
          echo "EASYPLEX_KEYSTORE_PASSWORD=$EASYPLEX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "EASYPLEX_KEY_ALIAS=$EASYPLEX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "EASYPLEX_KEY_PASSWORD=$EASYPLEX_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compile APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPlex-debug-apk
          path: android/app/build/outputs/apk/debug/EasyPlex-debug.apk
          if-no-files-found: error
